[Difficulty]
safe=Bezpieczny
safe_desc=Gra może być zapisana w dowolnym momencie. Jednakże, podobnie jak w przypadku obiektów SCP, klasyfikacja Bezpieczne nie oznacza, że obchodzenie się z nimi nie stwarza zagrożenia.
