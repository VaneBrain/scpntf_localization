euclid_desc=Obiekty klasy Euclid są w niewystarczającym stopniu zrozumiane lub z natury nieprzewidywalne, tak, że niezawodne zabezpieczenie nie zawsze jest możliwe. Na poziomie trudności Euclid, zapisywanie jest tylko dozwolone w określonych lokacjach oznaczonych włączonymi monitorami.
keter=Keter
keter_desc=Obiekty klasy Keter są uważane za najbardziej niebezpieczne w zabezpieczeniach Fundacji. To samo można powiedzieć o tym poziomie trudności: obiekty SCP są bardziej agresywne, a życie masz tylko jedno – gdy umrzesz, gra się zakończy.
